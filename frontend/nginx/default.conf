# Serves the SPA and reverse-proxies /api to the backend so the browser sees a single origin
# (session cookie + CSRF token stay first-party; no CORS needed).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    # Docker's embedded DNS; re-resolve the API container if it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API responses carry their own security headers (set by ASP.NET Core).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot inject forwarding chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA routes fall back to index.html, which must always be revalidated.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
