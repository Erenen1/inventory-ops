name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  backend:
    name: Backend (build, analyzers, format, tests, vulnerabilities)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore (locked mode)
        run: dotnet restore InventoryOps.slnx --locked-mode

      - name: Verify formatting and code style
        run: dotnet format InventoryOps.slnx --verify-no-changes --no-restore

      - name: Build (analyzers and warnings as errors)
        run: dotnet build InventoryOps.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test --project tests/InventoryOps.UnitTests -c Release --no-build

      - name: Architecture tests
        run: dotnet test --project tests/InventoryOps.ArchitectureTests -c Release --no-build

      - name: Integration tests (Testcontainers SQL Server, Redis, RabbitMQ)
        run: dotnet test --project tests/InventoryOps.IntegrationTests -c Release --no-build

      - name: Vulnerable NuGet packages (including transitive)
        run: |
          dotnet list InventoryOps.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  frontend:
    name: Frontend (format, lint, typecheck, tests, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Audit production dependencies (blocking at high)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (report only)
        run: npm audit || true

  docker:
    name: Docker images and Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate compose file with generated throwaway secrets
        run: |
          sh scripts/bootstrap.sh
          docker compose config --quiet

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: inventoryops-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: false
          tags: inventoryops-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
